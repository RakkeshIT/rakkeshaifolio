<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Canvas Window Mockup -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
  
  <!-- Window Header -->
  <line x1="80" y1="105" x2="720" y2="105" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <circle cx="105" cy="83" r="5" fill="#ef4444"/>
  <circle cx="123" cy="83" r="5" fill="#eab308"/>
  <circle cx="141" cy="83" r="5" fill="#22c55e"/>

  <!-- Toolbar Mockup -->
  <rect x="260" y="70" width="280" height="26" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
  <circle cx="280" cy="83" r="6" fill="#6366f1"/>
  <rect x="300" y="78" width="10" height="10" rx="2" fill="#a855f7"/>
  <circle cx="330" cy="83" r="5" fill="#ec4899"/>
  <rect x="350" y="78" width="10" height="10" rx="2" fill="#3b82f6"/>

  <!-- Drawn Elements on Whiteboard Canvas -->
  <path d="M 140 180 Q 220 120 320 190 T 500 160" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <rect x="180" y="220" width="130" height="70" rx="10" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="210" y="260" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="14">BRAINSTORM</text>
  
  <path d="M 320 255 L 410 255" fill="none" stroke="#e2e8f0" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="480" cy="255" r="45" fill="none" stroke="#10b981" stroke-width="3"/>
  <text x="455" y="260" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="13">IDEAS</text>

  <!-- Title Badge -->
  <text x="400" y="360" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24" letter-spacing="2">VAIRAA WHITEBOARD</text>
  <text x="400" y="380" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-weight="400" font-size="13">Interactive Real-time Collaborative Canvas</text>
</svg>

